name: pages

# Builds docs/ with oku (https://github.com/mmdemirbas/oku) and publishes
# docs/dist/site to GitHub Pages at https://mmdemirbas.github.io/ice-lens/.
# Separate from ci.yml on purpose: a red test must not take the docs down.

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the docs tree with oku (search extra bundles Pagefind)
        working-directory: docs
        run: uvx --from "oku[search] @ git+https://github.com/mmdemirbas/oku" oku build

      - name: Keep every _oku/ asset (Pages skips underscore paths only under Jekyll; this makes it explicit)
        run: touch docs/dist/site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
