# The second launcher jpackage builds into every installer: `icelens`, the command line, over the
# same jars and runtime as the app. jpackage's --add-launcher reads this file; the classpath is
# the app's (every jar under app/), so only the entry point and its JVM options are named. The
# logging configuration is named here as `main` names it, since the desktop's logback.xml is on
# the same classpath. win-console gives the Windows launcher a console, which the GUI app's has not.
main-class=cli.MainKt
java-options=-Dlogback.configurationFile=logback-cli.xml
win-console=true
